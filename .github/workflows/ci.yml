name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        # Real PostgreSQL + PostGIS for database integration tests - matching the version used in
        # infrastructure/docker/docker-compose.yml, not a mock or SQLite substitute. See
        # docs/04-design/DATABASE-DESIGN.md and docs/07-operations/DEVELOPMENT-SETUP.md.
        # POSTGRES_DB creates only the development database; the separate test database is
        # created by an explicit step below, since a `services:` container (unlike
        # docker-compose.yml's volume-mounted init script) cannot run custom init SQL itself.
        services:
            postgres:
                image: postgis/postgis:16-3.4
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dropzo
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dropzo"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - uses: actions/checkout@v4

            # NOTE: CI intentionally uses Node 22 LTS, not the non-LTS v25.7.0 pinned for local
            # development (see DEVELOPMENT-SETUP.md's CAUTION note) - LTS keeps CI's toolchain
            # warning-free rather than masking a real failure in EBADENGINE noise.
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npm run prisma:generate -w apps/api

            - name: Create the separate dropzo_test database
              env:
                  PGPASSWORD: postgres
              run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE dropzo_test;"

            # Two genuinely separate databases on the same Postgres instance - dropzo (development)
            # and dropzo_test (integration tests) - each with its own env file, mirroring
            # .env.example / .env.test.example exactly (never one copied from the other, which
            # would silently point both at the same database).
            - name: Create local env files
              run: |
                  cat > .env <<EOF
                  NODE_ENV=development
                  DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dropzo
                  APP_DATABASE_URL=postgresql://dropzo_app:dropzo_app_dev_only@localhost:5432/dropzo
                  EOF
                  cat > .env.test <<EOF
                  NODE_ENV=test
                  DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dropzo_test
                  APP_DATABASE_URL=postgresql://dropzo_app:dropzo_app_dev_only@localhost:5432/dropzo_test
                  EOF

            - name: Formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests (API, web, shared packages)
              run: npm run test

            - name: Prisma schema validation
              run: npm run prisma:validate -w apps/api

            - name: Validate seed UUIDs
              run: node scripts/validate-seed-uuids.mjs

            - name: Apply migrations to the development database
              run: npm run prisma:migrate:deploy -w apps/api

            - name: Apply migrations to the test database
              run: npm run prisma:migrate:deploy:test -w apps/api

            - name: Set the dropzo_app role's password (the migration deliberately creates it with none - a role is cluster-wide, so this only needs to run once, after either migration)
              run: npm run prisma:set-app-password -w apps/api

            - name: Run the deterministic seed (first execution)
              run: npm run db:seed -w apps/api

            - name: Re-run the seed to verify idempotency (must not error or duplicate rows)
              run: npm run db:seed -w apps/api

            # Defence in depth, separate from the same check built into
            # apps/api/test/helpers/clients.ts: fail the job with a clear message rather than a
            # cryptic test failure if the test suite's own target database is ever misconfigured.
            - name: Verify the integration suite targets dropzo_test, not dropzo
              run: |
                  set -e
                  export $(grep -v '^#' .env.test | xargs)
                  DB_NAME=$(node -e "console.log(new URL(process.env.DATABASE_URL).pathname.replace(/^\//, ''))")
                  echo "Integration suite will target database: $DB_NAME"
                  if [ "$DB_NAME" != "dropzo_test" ]; then
                    echo "::error::.env.test's DATABASE_URL points at \"$DB_NAME\", not \"dropzo_test\"."
                    exit 1
                  fi

            - name: Database integration and concurrency tests (dropzo_test only)
              run: npm run test:integration -w apps/api

            - name: Production builds
              run: npm run build
