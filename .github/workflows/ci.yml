name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        # Real PostgreSQL + PostGIS for database integration tests - matching the version used in
        # infrastructure/docker/docker-compose.yml, not a mock or SQLite substitute. See
        # docs/04-design/DATABASE-DESIGN.md and docs/07-operations/DEVELOPMENT-SETUP.md.
        services:
            postgres:
                image: postgis/postgis:16-3.4
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dropzo_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dropzo_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - uses: actions/checkout@v4

            # NOTE: CI intentionally uses Node 22 LTS, not the non-LTS v25.7.0 pinned for local
            # development (see DEVELOPMENT-SETUP.md's CAUTION note) - LTS keeps CI's toolchain
            # warning-free rather than masking a real failure in EBADENGINE noise.
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Create local env files (mirrors .env.example / .env.test.example for this job)
              run: |
                  cat > .env <<EOF
                  NODE_ENV=test
                  DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dropzo_test
                  APP_DATABASE_URL=postgresql://dropzo_app:dropzo_app_dev_only@localhost:5432/dropzo_test
                  EOF
                  cp .env .env.test

            - name: Formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests (API, web, shared packages)
              run: npm run test

            - name: Prisma schema validation
              run: npm run prisma:validate -w apps/api

            - name: Run migrations against the CI Postgres service
              run: npm run prisma:migrate:deploy -w apps/api

            - name: Set the dropzo_app role's password (the migration deliberately creates it with none)
              run: npm run prisma:set-app-password -w apps/api

            - name: Database integration and concurrency tests
              run: npm run test:integration -w apps/api

            - name: Production builds
              run: npm run build
