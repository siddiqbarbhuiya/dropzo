# Local PostgreSQL + PostGIS infrastructure for Dropzo development.
# Started via `nx run infrastructure:dev` (or `nx run-many -t dev`, which includes it).
# CAUTION: the default credentials below are for local development only. Never reuse them
# anywhere a real network can reach this container.
name: dropzo

services:
    postgres:
        image: postgis/postgis:16-3.4
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-dropzo}
            POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-dropzo_test}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - dropzo_postgres_data:/var/lib/postgresql/data
            - ./init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dropzo}']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

volumes:
    dropzo_postgres_data:
        name: dropzo_postgres_data
